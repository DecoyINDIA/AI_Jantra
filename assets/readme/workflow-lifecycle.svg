<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="auto">
  <defs>
    <radialGradient id="wf-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#07090f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="track-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .card-shell { fill: #080a13; stroke: #1a2238; stroke-width: 1.2; rx: 14px; }
    .step-card { fill: #0d1222; stroke: #1f2a44; stroke-width: 1; rx: 8px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes pulse-travel {
      0% { cx: 80px; }
      25% { cx: 270px; }
      50% { cx: 470px; }
      75% { cx: 670px; }
      100% { cx: 860px; }
    }
    @keyframes node-shine {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes gate-glow {
      0%, 100% { stroke: #f59e0b; stroke-opacity: 0.6; }
      50% { stroke: #fef08a; stroke-opacity: 1; }
    }

    .pipeline-photon {
      animation: pulse-travel 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .active-node {
      transform-origin: center;
      animation: node-shine 2s ease-in-out infinite;
    }
    .gate-border {
      animation: gate-glow 2s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect width="940" height="260" class="card-shell" />
  <rect width="940" height="260" fill="url(#wf-glow)" rx="14" />

  <!-- Title Row -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="#f8fafc" font-size="14" font-weight="700" class="sans">Deterministic Pipeline Execution Lifecycle</text>
    <text x="360" y="0" fill="#64748b" font-size="11" class="mono">STAGE RUNNERS SHARE StageContext • AUDITED END-TO-END</text>
  </g>

  <!-- Flow Track Line -->
  <g transform="translate(0, 68)">
    <line x1="80" y1="0" x2="860" y2="0" stroke="#1e2942" stroke-width="2.5" />
    <line x1="80" y1="0" x2="860" y2="0" stroke="url(#track-pulse)" stroke-width="2" stroke-dasharray="160 300" stroke-linecap="round" />
    <!-- Traveling Photon Particle -->
    <circle cy="0" r="6" fill="#38bdf8" class="pipeline-photon" filter="drop-shadow(0 0 8px #38bdf8)" />
  </g>

  <!-- ================= 5 LIFECYCLE PHASES ================= -->
  <!-- STEP 01: INTAKE -->
  <g transform="translate(32, 92)">
    <rect width="160" height="138" class="step-card" stroke="#38bdf8" />
    <circle cx="20" cy="22" r="10" fill="#0369a1" />
    <text x="20" y="26" text-anchor="middle" fill="#e0f2fe" font-size="10.5" font-weight="700" class="mono">01</text>
    <text x="38" y="26" fill="#38bdf8" font-size="12" font-weight="700" class="mono">INTAKE</text>
    
    <text x="14" y="52" fill="#cbd5e1" font-size="11" class="sans">Multi-turn idea</text>
    <text x="14" y="68" fill="#cbd5e1" font-size="11" class="sans">clarification</text>
    
    <g transform="translate(14, 94)">
      <rect width="132" height="24" rx="4" fill="#0f172a" stroke="#1e2942" stroke-width="0.8" />
      <text x="8" y="16" fill="#38bdf8" font-size="9.5" font-weight="600" class="mono">idea_summary.md</text>
    </g>
  </g>

  <!-- STEP 02: GATE #1 -->
  <g transform="translate(212, 92)">
    <rect width="140" height="138" class="step-card gate-border" stroke="#f59e0b" fill="#141108" />
    <circle cx="20" cy="22" r="10" fill="#78350f" />
    <text x="20" y="26" text-anchor="middle" fill="#fef3c7" font-size="10.5" font-weight="700" class="mono">G1</text>
    <text x="38" y="26" fill="#f59e0b" font-size="12" font-weight="700" class="mono">GATE 1</text>
    
    <text x="14" y="52" fill="#fef08a" font-size="11" font-weight="600" class="sans">Operator Review</text>
    <text x="14" y="68" fill="#94a3b8" font-size="10.5" class="sans">Sign-off on idea</text>

    <g transform="translate(14, 94)">
      <rect width="112" height="24" rx="4" fill="#292008" stroke="#f59e0b" stroke-width="0.8" />
      <text x="8" y="16" fill="#fde68a" font-size="9.5" font-weight="700" class="mono">CONFIRM / HALT</text>
    </g>
  </g>

  <!-- STEP 03: RESEARCH -->
  <g transform="translate(372, 92)">
    <rect width="180" height="138" class="step-card" stroke="#a855f7" />
    <circle cx="20" cy="22" r="10" fill="#581c87" />
    <text x="20" y="26" text-anchor="middle" fill="#f3e8ff" font-size="10.5" font-weight="700" class="mono">02</text>
    <text x="38" y="26" fill="#c084fc" font-size="12" font-weight="700" class="mono">RESEARCH</text>
    
    <text x="14" y="52" fill="#cbd5e1" font-size="11" class="sans">Concurrent web fetch</text>
    <text x="14" y="68" fill="#a7f3d0" font-size="10.5" font-weight="600" class="mono">✓ Quote verification</text>

    <g transform="translate(14, 94)">
      <rect width="152" height="24" rx="4" fill="#0f172a" stroke="#1e2942" stroke-width="0.8" />
      <text x="8" y="16" fill="#c084fc" font-size="9.5" font-weight="600" class="mono">research_report.md</text>
    </g>
  </g>

  <!-- STEP 04: GATE #2 -->
  <g transform="translate(572, 92)">
    <rect width="140" height="138" class="step-card gate-border" stroke="#f59e0b" fill="#141108" />
    <circle cx="20" cy="22" r="10" fill="#78350f" />
    <text x="20" y="26" text-anchor="middle" fill="#fef3c7" font-size="10.5" font-weight="700" class="mono">G2</text>
    <text x="38" y="26" fill="#f59e0b" font-size="12" font-weight="700" class="mono">GATE 2</text>
    
    <text x="14" y="52" fill="#fef08a" font-size="11" font-weight="600" class="sans">Market Validation</text>
    <text x="14" y="68" fill="#94a3b8" font-size="10.5" class="sans">Check cited evidence</text>

    <g transform="translate(14, 94)">
      <rect width="112" height="24" rx="4" fill="#292008" stroke="#f59e0b" stroke-width="0.8" />
      <text x="8" y="16" fill="#fde68a" font-size="9.5" font-weight="700" class="mono">CONFIRM / HALT</text>
    </g>
  </g>

  <!-- STEP 05: PLANNING -->
  <g transform="translate(732, 92)">
    <rect width="176" height="138" class="step-card" stroke="#10b981" />
    <circle cx="20" cy="22" r="10" fill="#064e3b" />
    <text x="20" y="26" text-anchor="middle" fill="#d1fae5" font-size="10.5" font-weight="700" class="mono">03</text>
    <text x="38" y="26" fill="#34d399" font-size="12" font-weight="700" class="mono">PLANNING</text>
    
    <text x="14" y="52" fill="#cbd5e1" font-size="11" class="sans">Generator ≠ Critic</text>
    <text x="14" y="68" fill="#cbd5e1" font-size="11" class="sans">Rubric evaluation</text>

    <g transform="translate(14, 94)">
      <rect width="148" height="24" rx="4" fill="#0f172a" stroke="#1e2942" stroke-width="0.8" />
      <text x="8" y="16" fill="#10b981" font-size="9.5" font-weight="700" class="mono">PRD • TRD • Build Plan</text>
    </g>
  </g>
</svg>