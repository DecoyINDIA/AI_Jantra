<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="auto">
  <defs>
    <linearGradient id="divider-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="20%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulse-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes beam-slide {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(900px); }
    }
    @keyframes core-pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .beam-runner { animation: beam-slide 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .center-node { transform-origin: 450px 12px; animation: core-pulse 2.5s ease-in-out infinite; }
  </style>

  <!-- Base Line -->
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#divider-track)" stroke-width="1.2" />

  <!-- Animated Flying Beam -->
  <g class="beam-runner">
    <line x1="0" y1="12" x2="180" y2="12" stroke="url(#pulse-beam)" stroke-width="2.5" stroke-linecap="round" filter="drop-shadow(0 0 6px #00f2fe)" />
    <circle cx="180" cy="12" r="3" fill="#ffffff" filter="drop-shadow(0 0 4px #00f2fe)" />
  </g>

  <!-- Center Jewel Node -->
  <g class="center-node">
    <circle cx="450" cy="12" r="6" fill="#0b0f19" stroke="#7c3aed" stroke-width="1.5" />
    <circle cx="450" cy="12" r="2.5" fill="#00f2fe" />
  </g>
</svg>