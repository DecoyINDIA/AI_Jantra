<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="hero-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#640ec1" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#1e1035" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#07080e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="border-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#640ec1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2438" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#7c3aed" fill-opacity="0.4" />
    </pattern>

    <!-- Gear Tooth Path definition (from brand icon) -->
    <g id="gear-tooth">
      <path d="M 0 -18 L -14 -32 L -14 -72 A 14 14 0 0 1 14 -72 L 14 -32 Z" />
    </g>
  </defs>

  <style>
    .bg { fill: #07090e; }
    .border-stroke { stroke: #1e2438; stroke-width: 1.5; fill: none; }
    
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse-ring {
      0% { r: 60px; opacity: 0.8; stroke-width: 2px; }
      50% { opacity: 0.3; stroke-width: 1.5px; }
      100% { r: 140px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes beam-travel {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: -600; }
    }
    @keyframes float-gentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes orbit-particle {
      from { transform: rotate(0deg) translateX(110px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(110px) rotate(-360deg); }
    }
    
    .yantra-cw { transform-origin: 480px 175px; animation: spin-cw 24s linear infinite; }
    .yantra-ccw { transform-origin: 480px 175px; animation: spin-ccw 36s linear infinite; }
    .yantra-pulse-glow { transform-origin: 480px 175px; animation: pulse-glow 4s ease-in-out infinite; }
    .ring-pulse-1 { transform-origin: 480px 175px; animation: pulse-ring 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
    .ring-pulse-2 { transform-origin: 480px 175px; animation: pulse-ring 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 2s; }
    .particle-orbit { transform-origin: 480px 175px; animation: orbit-particle 12s linear infinite; }
    .status-dot { animation: blink 2s ease-in-out infinite; }
    .circuit-beam { stroke-dasharray: 80 200; animation: beam-travel 6s linear infinite; }
    .float-card { animation: float-gentle 5s ease-in-out infinite; }
    
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Background with outer container -->
  <rect width="960" height="440" rx="16" class="bg" />
  <rect width="960" height="440" fill="url(#grid)" rx="16" />
  <rect width="960" height="440" rx="16" fill="url(#hero-glow)" />
  <rect width="960" height="440" rx="16" fill="url(#cyan-glow)" />
  <rect x="0.75" y="0.75" width="958.5" height="438.5" rx="15.25" class="border-stroke" />

  <!-- Top Accent Beam -->
  <line x1="120" y1="1" x2="840" y2="1" stroke="url(#border-beam)" stroke-width="2" />

  <!-- Circuit Trace Lines Left & Right -->
  <g stroke="#262c45" stroke-width="1" fill="none">
    <path d="M 60 175 L 180 175 L 240 135 L 340 135" />
    <path d="M 900 175 L 780 175 L 720 135 L 620 135" />
    <path d="M 120 230 L 220 230 L 280 200 L 330 200" />
    <path d="M 840 230 L 740 230 L 680 200 L 630 200" />
    <!-- Glowing beams traveling through traces -->
    <path d="M 60 175 L 180 175 L 240 135 L 340 135" stroke="#a855f7" stroke-width="1.5" class="circuit-beam" />
    <path d="M 900 175 L 780 175 L 720 135 L 620 135" stroke="#00f2fe" stroke-width="1.5" class="circuit-beam" />
    <circle cx="60" cy="175" r="3" fill="#640ec1" />
    <circle cx="340" cy="135" r="3" fill="#a855f7" />
    <circle cx="900" cy="175" r="3" fill="#00f2fe" />
    <circle cx="620" cy="135" r="3" fill="#00f2fe" />
  </g>

  <!-- TOP TAG BADGE -->
  <g transform="translate(480, 42)" text-anchor="middle">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0d111d" stroke="#2b334d" stroke-width="1" />
    <circle cx="-146" cy="0" r="4.5" fill="#10b981" class="status-dot" />
    <text x="10" y="4" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1.5" class="mono">
      JANTRA RUNTIME • v0.0.1 • PRODUCTION READY
    </text>
  </g>

  <!-- ================= CENTERPIECE: THE YANTRA MECHANISM ================= -->
  <g id="center-yantra">
    <!-- Expanding Energy Wave Rings -->
    <circle cx="480" cy="175" r="60" fill="none" stroke="#a855f7" class="ring-pulse-1" />
    <circle cx="480" cy="175" r="60" fill="none" stroke="#00f2fe" class="ring-pulse-2" />

    <!-- Ambient Core Glow -->
    <circle cx="480" cy="175" r="80" fill="#7c3aed" class="yantra-pulse-glow" filter="blur(20px)" />

    <!-- Outer Calibrated Degree Ring (Counter-Clockwise) -->
    <g class="yantra-ccw">
      <circle cx="480" cy="175" r="102" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2 6" />
      <circle cx="480" cy="175" r="92" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
      <!-- Calibrated Cardinal Markers -->
      <line x1="480" y1="73" x2="480" y2="83" stroke="#a855f7" stroke-width="2" />
      <line x1="480" y1="267" x2="480" y2="277" stroke="#a855f7" stroke-width="2" />
      <line x1="378" y1="175" x2="388" y2="175" stroke="#00f2fe" stroke-width="2" />
      <line x1="572" y1="175" x2="582" y2="175" stroke="#00f2fe" stroke-width="2" />
      <!-- Small satellite nodes -->
      <circle cx="480" cy="78" r="3" fill="#a855f7" />
      <circle cx="480" cy="272" r="3" fill="#a855f7" />
      <circle cx="383" cy="175" r="3" fill="#00f2fe" />
      <circle cx="577" cy="175" r="3" fill="#00f2fe" />
    </g>

    <!-- Secondary Hexagonal Geometric Star (Counter-Clockwise) -->
    <g class="yantra-ccw">
      <polygon points="480,105 540,210 420,210" fill="none" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.5" />
      <polygon points="480,245 540,140 420,140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
    </g>

    <!-- The Master Yantra Gear Core (Clockwise, 6-Fold Radial Petals) -->
    <g class="yantra-cw">
      <!-- 6 Gear Teeth rotated 60 deg each -->
      <g transform="translate(480, 175)">
        <g transform="rotate(0)" fill="url(#metal-grad)">
          <use href="#gear-tooth" />
        </g>
        <g transform="rotate(60)" fill="url(#metal-grad)">
          <use href="#gear-tooth" />
        </g>
        <g transform="rotate(120)" fill="url(#metal-grad)">
          <use href="#gear-tooth" />
        </g>
        <g transform="rotate(180)" fill="url(#metal-grad)">
          <use href="#gear-tooth" />
        </g>
        <g transform="rotate(240)" fill="url(#metal-grad)">
          <use href="#gear-tooth" />
        </g>
        <g transform="rotate(300)" fill="url(#metal-grad)">
          <use href="#gear-tooth" />
        </g>

        <!-- Inner interlocking hub -->
        <circle cx="0" cy="0" r="42" fill="#0f111a" stroke="#a855f7" stroke-width="2.5" />
        <circle cx="0" cy="0" r="32" fill="#171926" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 2" />
        <circle cx="0" cy="0" r="18" fill="#640ec1" />
        <circle cx="0" cy="0" r="8" fill="#ffffff" />
      </g>
    </g>

    <!-- Orbiting Energy Particle -->
    <g class="particle-orbit">
      <circle cx="480" cy="175" r="4" fill="#00f2fe" filter="drop-shadow(0 0 6px #00f2fe)" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & IDENTITY ================= -->
  <!-- Main Brand Title -->
  <text x="480" y="322" text-anchor="middle" font-size="38" font-weight="900" letter-spacing="8" fill="url(#text-grad)" class="sans">
    JANTRA AI
  </text>

  <!-- High-Concept Subtitle -->
  <text x="480" y="352" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="2" fill="#94a3b8" class="sans">
    THE DETERMINISTIC AGENT RUNTIME &amp; HUMAN-GATED PLANNING PIPELINE
  </text>

  <!-- Core Metric / Philosophy Badges -->
  <g transform="translate(480, 396)" text-anchor="middle" class="mono" font-size="10.5">
    <!-- Badge 1: Ground or Abstain -->
    <g transform="translate(-290, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="6" fill="#111522" stroke="#1f273d" stroke-width="1" />
      <circle cx="-68" cy="0" r="3" fill="#10b981" />
      <text x="6" y="3.5" fill="#a7f3d0" font-weight="600">GROUND OR ABSTAIN</text>
    </g>
    <!-- Badge 2: Generator != Critic -->
    <g transform="translate(-95, 0)">
      <rect x="-90" y="-13" width="180" height="26" rx="6" fill="#111522" stroke="#1f273d" stroke-width="1" />
      <circle cx="-73" cy="0" r="3" fill="#a855f7" />
      <text x="6" y="3.5" fill="#e9d5ff" font-weight="600">GENERATOR ≠ CRITIC</text>
    </g>
    <!-- Badge 3: Immutable JSONL Audit -->
    <g transform="translate(100, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="6" fill="#111522" stroke="#1f273d" stroke-width="1" />
      <circle cx="-68" cy="0" r="3" fill="#00f2fe" />
      <text x="6" y="3.5" fill="#bae6fd" font-weight="600">IMMUTABLE JSONL AUDIT</text>
    </g>
    <!-- Badge 4: Fail-Closed Gates -->
    <g transform="translate(290, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="6" fill="#111522" stroke="#1f273d" stroke-width="1" />
      <circle cx="-68" cy="0" r="3" fill="#f59e0b" />
      <text x="6" y="3.5" fill="#fef3c7" font-weight="600">FAIL-CLOSED GATES</text>
    </g>
  </g>
</svg>