<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 100" width="100%" height="auto">
  <defs>
    <radialGradient id="ribbon-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#640ec1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glow-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes metric-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes badge-shimmer {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.3)); }
      50% { filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.7)); }
    }
    .pulse-dot { animation: metric-pulse 2s ease-in-out infinite; }
    .shimmer-green { animation: badge-shimmer 3s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect width="940" height="100" rx="12" fill="#080a13" stroke="#1c2438" stroke-width="1.2" />
  <rect width="940" height="100" rx="12" fill="url(#ribbon-glow)" />
  <line x1="80" y1="1" x2="860" y2="1" stroke="url(#glow-edge)" stroke-width="2" />

  <!-- 4 Metrics Columns -->
  <!-- Col 1: Deterministic Grounding -->
  <g transform="translate(40, 24)">
    <circle cx="6" cy="12" r="4" fill="#10b981" class="pulse-dot" />
    <text x="18" y="16" fill="#10b981" font-size="20" font-weight="800" class="mono shimmer-green">100%</text>
    <text x="18" y="36" fill="#f8fafc" font-size="11.5" font-weight="700" class="sans">DETERMINISTIC CITATIONS</text>
    <text x="18" y="52" fill="#64748b" font-size="10" class="mono">Ground or abstain by code</text>
  </g>
  <line x1="250" y1="20" x2="250" y2="80" stroke="#1c2438" stroke-width="1" />

  <!-- Col 2: Generator != Critic -->
  <g transform="translate(275, 24)">
    <circle cx="6" cy="12" r="4" fill="#a855f7" class="pulse-dot" />
    <text x="18" y="16" fill="#c084fc" font-size="20" font-weight="800" class="mono">2-PASS</text>
    <text x="18" y="36" fill="#f8fafc" font-size="11.5" font-weight="700" class="sans">GENERATOR ≠ CRITIC</text>
    <text x="18" y="52" fill="#64748b" font-size="10" class="mono">Strict rubric gate before ship</text>
  </g>
  <line x1="480" y1="20" x2="480" y2="80" stroke="#1c2438" stroke-width="1" />

  <!-- Col 3: Sub-Cent Precision Telemetry -->
  <g transform="translate(505, 24)">
    <circle cx="6" cy="12" r="4" fill="#38bdf8" class="pulse-dot" />
    <text x="18" y="16" fill="#38bdf8" font-size="20" font-weight="800" class="mono">&lt;$0.20</text>
    <text x="18" y="36" fill="#f8fafc" font-size="11.5" font-weight="700" class="sans">SUB-CENT PIPELINE SPEND</text>
    <text x="18" y="52" fill="#64748b" font-size="10" class="mono">Reserve &amp; settle cost ceiling</text>
  </g>
  <line x1="710" y1="20" x2="710" y2="80" stroke="#1c2438" stroke-width="1" />

  <!-- Col 4: 20 Offline Regressions -->
  <g transform="translate(735, 24)">
    <circle cx="6" cy="12" r="4" fill="#f59e0b" class="pulse-dot" />
    <text x="18" y="16" fill="#fde68a" font-size="20" font-weight="800" class="mono">20 / 20</text>
    <text x="18" y="36" fill="#f8fafc" font-size="11.5" font-weight="700" class="sans">OFFLINE REGRESSIONS</text>
    <text x="18" y="52" fill="#64748b" font-size="10" class="mono">Zero-credential offline CI</text>
  </g>
</svg>