name: CI

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on other branches; a base-branch
  # filter left stacked PRs with no CI at all.
  pull_request:

# Least privilege: CI only needs to read the repo. A compromised dependency or
# action then cannot push code or tamper with releases through GITHUB_TOKEN.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (version in the trailing
# comment) so a moved or compromised tag cannot change what CI executes.

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all packages
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npx tsc -p tsconfig.json

      - name: Build web
        run: npm run build --workspace=@jantra/web

      - name: Build client
        run: npm run build --workspace=@jantra/client

      - name: Build embed-widget
        run: npm run build --workspace=@jantra/embed-widget

      - name: Upload runtime dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: runtime-dist
          path: dist/
          retention-days: 7

  behavioral-eval:
    name: Behavioral eval + smoke
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Behavioral eval suite (guardrails + security regressions)
        run: npm run eval

      - name: Pipeline smoke test
        run: npm run smoke

      - name: Server smoke test
        run: npm run server:smoke

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories that have a non-breaking fix; lists
      # unfixable ones as warnings (see scripts/audit-gate.mjs).
      - name: Dependency audit gate (production tree, strict)
        run: node scripts/audit-gate.mjs --omit=dev --strict

      - name: Dependency audit gate (full tree incl. build tooling)
        run: node scripts/audit-gate.mjs

      - name: Secret scan (tracked files)
        run: node scripts/secret-scan.mjs

      # Edge Worker + origin in-process: origin allowlist, Turnstile, edge
      # secret lock, run tokens, header smuggling, rate limit.
      - name: Edge verification (local harness)
        run: npm run edge:verify:local

      - name: Desktop window/navigation policy (unit)
        run: npm test -w @jantra/desktop

      # Real Electron: window.open, navigation, report isolation, IPC sender
      # checks, permission denial. xvfb provides the display.
      - name: Desktop Electron security (e2e)
        run: |
          npm run build -w @jantra/desktop
          xvfb-run -a npm run test:e2e -w @jantra/desktop

  desktop-package:
    name: Desktop package (build + acceptance)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # The packaged app ships its own Node (Electron); the host Node only
          # runs the build tools and the CDP harness, which uses the global
          # WebSocket (Node >= 22).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runtime, web UI and desktop shell
        run: npm run build && npm run web:build && npm run build -w @jantra/desktop

      # Unpacked Linux build: stages runtime + UI, applies Electron fuses.
      - name: Package desktop app
        run: npm run dist -w @jantra/desktop -- --linux dir

      # Launches the packaged binary: UI over app://, API + CORS, licensed run
      # in SQLite, persistence across restart, CSP and window policy.
      - name: Packaged app acceptance
        run: xvfb-run -a npm run test:packaged -w @jantra/desktop

